spring:
  application:
    name: agrinexus-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrinexus}
    username: ${DB_USERNAME:agrinexus}
    password: ${DB_PASSWORD:agrinexus-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agrinexus:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-now}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:60}

