<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in - AgriNexus</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="panel">
            <h3>Partner onboarding</h3>
            <form id="register-form" class="stack-form">
              <input id="register-name" placeholder="Full name" required />
              <input id="register-email" type="email" placeholder="Email" required />
              <select id="register-role">
                <option value="farmer">Farmer</option>
                <option value="cooperative">Cooperative</option>
                <option value="government">Government</option>
                <option value="supplier">Supplier</option>
                <option value="buyer">Buyer</option>
              </select>
              <button type="submit">Register & sign in</button>
            </form>
            <div id="profile-panel" class="profile-panel" hidden>
              <h4>Signed-in profile</h4>
              <p><strong id="profile-name">—</strong></p>
              <p id="profile-email">—</p>
              <p id="profile-role">—</p>
              <p id="profile-status">You are now signed in as a registered AgriNexus user.</p>
            </div>
            <p id="register-status" class="status-text">Ready to onboard a new partner.</p>
          </div>
</body>
</html>
