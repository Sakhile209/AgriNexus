services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agrinexus
      POSTGRES_USER: agrinexus
      POSTGRES_PASSWORD: agrinexus-local
    ports:
      - "5432:5432"
    volumes:
      - agrinexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinexus -d agrinexus"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/agrinexus
      DB_USERNAME: agrinexus
      DB_PASSWORD: agrinexus-local
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrinexus-postgres:
